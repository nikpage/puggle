<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pet Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
        }

        .slider-group {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .slider-group h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .slider-row {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 15px;
        }

        .slider-row label {
            font-size: 12px;
            color: #666;
            min-width: 40px;
        }

        .slider-row input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .slider-row input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .slider-value {
            min-width: 40px;
            text-align: right;
            font-weight: 600;
            color: #667eea;
        }

        .weight-input {
            width: 60px;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
        }

        .weight-total {
            margin-top: 15px;
            padding: 12px;
            background: white;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            color: #333;
        }

        .weight-total.error {
            background: #ffe0e0;
            color: #c00;
        }

        .weight-total.ok {
            background: #e0ffe0;
            color: #060;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .save-btn {
            background: #667eea;
            color: white;
        }

        .save-btn:hover {
            background: #5568d3;
        }

        .back-btn {
            background: #eee;
            color: #333;
        }

        .back-btn:hover {
            background: #ddd;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #666;
            min-height: 20px;
        }

        .status.success {
            color: #060;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Pet Settings</h1>

        <div class="slider-group" style="border-left-color: #e74c3c;">
            <h2>Gemini API Key</h2>
            <div class="slider-row">
                <input
                    type="password"
                    id="apiKeyInput"
                    placeholder="Paste your Gemini API key here"
                    style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;"
                >
                <button class="save-btn" id="saveApiKeyBtn" style="flex: none; padding: 10px 16px; font-size: 14px;">Save Key</button>
            </div>
            <p style="color: #999; font-size: 12px; margin-top: 8px;">Your key is stored in your browser only. Never shared.</p>
        </div>

        <div id="sliderContainer"></div>

        <div class="button-group">
            <button class="save-btn" id="saveBtn">Save Settings</button>
            <button class="back-btn" id="backBtn">Back to Chat</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script src="config-ui.js"></script>
</body>
</html>
